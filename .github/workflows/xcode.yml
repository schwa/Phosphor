# Generated by: xcb ci generate --xcode 27 --runner xcode-27
name: Xcode
on:
  push:
  pull_request:

jobs:
  build-example:
    runs-on: xcode-27
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=xrOS"
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download MetalToolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Trust plugins
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Build Example App (${{ matrix.destination }})
        run: |
          xcodebuild build \
            -workspace Phosphor-Dev.xcworkspace \
            -scheme collab-cli \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
